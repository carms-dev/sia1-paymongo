<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Check your BUDOL order payment status.">
    <meta name="theme-color" content="#F36B3F">
    <title>Payment status | BUDOL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/buyer.css">
    <script type="module" src="/js/success-page.js"></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>
    <main class="page-container buyer-main" id="main">
        <section class="card checkout-return" aria-labelledby="return-title">
            <p class="eyebrow">CHECKOUT RETURN</p>
            <h1 id="return-title">Confirming your payment...</h1>
            <p>We’ll verify your payment using the order status from the server. Returning from PayMongo alone does not confirm payment.</p>
            <p id="order-status" class="return-status" role="status" aria-live="polite" data-cy="order-status">Confirming your payment...</p>
            <p id="confirmed-order-number" hidden></p>
            <ul id="confirmed-order-items" class="confirmed-order-items" hidden></ul>
            <div id="confirmed-order-actions" class="return-actions" hidden></div>
            <button id="retry-status" class="button button-secondary" type="button" hidden>Check again</button>
        </section>
    </main>
    <div id="site-footer"></div>
</body>
</html>
