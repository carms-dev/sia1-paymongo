<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Review your order and continue to PayMongo hosted checkout.">
    <meta name="theme-color" content="#F36B3F">
    <title>Checkout | BUDOL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/buyer.css">
    <script type="module" src="/js/checkout-page.js"></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="checkout-header">
        <a class="store-logo" href="/index.html" aria-label="BUDOL home"><span class="store-logo-mark" aria-hidden="true">B</span><span>BUDOL<span>.</span></span></a>
        <nav class="checkout-steps" aria-label="Checkout progress">
            <a href="/cart.html">Cart</a><span aria-hidden="true">›</span>

            <span>Payment</span><span aria-hidden="true">›</span><span>Confirmation</span>
        </nav>
    </header>
    <main class="page-container buyer-main" id="main">
        <div class="buyer-section-heading"><div><h1>Checkout</h1><p>Review your delivery details and continue to PayMongo hosted checkout.</p></div></div>
        <div id="checkout-content" class="cart-layout" aria-live="polite"></div>
    </main>
    <div id="site-footer"></div>

</html>
